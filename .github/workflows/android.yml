name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ master, preferences_datastore, proto_datastore ]
  pull_request:
    branches: [ master, preferences_datastore, proto_datastore ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'        
        distribution: 'adopt'
        cache: gradle

    - name: Build with Gradle
      run: ./gradlew build
